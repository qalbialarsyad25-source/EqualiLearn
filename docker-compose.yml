services:

  postgres:
    image: postgres:16-alpine
    container_name: equillearn-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bakso_22
      POSTGRES_DB: EquilLearn

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d EquilLearn"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: equillearn-redis
    restart: always

    # ports:
    #   - "6379:6379"  # disabled — local Redis already uses this port

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: equillearn-backend
    restart: always

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      REDIS_HOST: redis

volumes:
  postgres_data: