<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EquiliLearn - Speech AI Studio (STT & TTS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(22, 28, 45, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --accent: #06b6d4;
      --accent-glow: rgba(6, 182, 212, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top center, #171f38 0%, var(--bg-dark) 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 9999px;
      font-size: 0.82rem;
      color: #a5b4fc;
      font-weight: 500;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* Tabs Navigation */
    .tabs-nav {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.35rem;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      max-width: 440px;
      margin: 0 auto;
    }

    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      border-radius: 9999px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
      color: #ffffff;
      box-shadow: 0 4px 15px -3px var(--primary-glow);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 1.75rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    @media (max-width: 640px) {
      .settings-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input, select, textarea {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      padding: 0.7rem 0.9rem;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.6;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .visualizer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      margin: 1rem 0;
    }

    canvas#audioVisualizer {
      width: 100%;
      height: 70px;
      border-radius: 0.75rem;
      background: rgba(11, 15, 25, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    button.btn-primary {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.9rem 2rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px var(--primary-glow);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button.btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px var(--primary-glow);
    }

    button.btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    button.mic-btn.recording {
      background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
      box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.4);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .status-dot.streaming {
      background: var(--danger);
      box-shadow: 0 0 10px var(--danger);
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    .transcript-box {
      margin-top: 1rem;
      background: rgba(11, 15, 25, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0.85rem;
      padding: 1.25rem;
      min-height: 180px;
      max-height: 360px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .final-text {
      color: #f8fafc;
      display: inline;
    }

    .interim-text {
      color: #94a3b8;
      font-style: italic;
      display: inline;
      background: rgba(99, 102, 241, 0.1);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
    }

    .actions-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 0.45rem 0.9rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* TTS Preset Chips */
    .preset-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .chip {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      color: #c7d2fe;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip:hover {
      background: rgba(99, 102, 241, 0.25);
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    /* TTS Audio Player Widget */
    .tts-player-card {
      margin-top: 1.5rem;
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .voice-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(6, 182, 212, 0.15);
      color: #67e8f9;
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
    }

    audio {
      width: 100%;
      outline: none;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-badge">⚡ EquiliLearn Speech AI Engine</div>
      <h1>Speech AI Studio</h1>
      <p class="subtitle">Real-time Speech Recognition (STT) & Natural Voice Synthesis (TTS) powered by Deepgram.</p>
    </header>

    <!-- Navigation Tabs -->
    <div class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('ttsTab', this)">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
        Text-to-Speech
      </button>
      <button class="tab-btn" onclick="switchTab('sttTab', this)">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
        </svg>
        Speech-to-Text
      </button>
    </div>

    <!-- ========================================== -->
    <!-- TAB 1: TEXT-TO-SPEECH (TTS)               -->
    <!-- ========================================== -->
    <div id="ttsTab" class="tab-content active">
      <div class="card">
        <div class="settings-grid">
          <div class="form-group">
            <label for="ttsVoiceSelect">Deepgram Aura Voice Model</label>
            <select id="ttsVoiceSelect">
              <option value="aura-asteria-en">Asteria (Female - Warm, Confident, US)</option>
              <option value="aura-luna-en">Luna (Female - Upbeat, Casual, US)</option>
              <option value="aura-stella-en">Stella (Female - Articulate, Polished, US)</option>
              <option value="aura-athena-en">Athena (Female - Sophisticated, British)</option>
              <option value="aura-hera-en">Hera (Female - Authoritative, Clear, US)</option>
              <option value="aura-orion-en">Orion (Male - Approachable, Storyteller, US)</option>
              <option value="aura-arcas-en">Arcas (Male - Calm, Instructional, US)</option>
              <option value="aura-perseus-en">Perseus (Male - Casual, Youthful, US)</option>
              <option value="aura-angus-en">Angus (Male - Rich, Irish Accent)</option>
              <option value="aura-orpheus-en">Orpheus (Male - Deep, Resonant, US)</option>
              <option value="aura-helios-en">Helios (Male - Cultured, British)</option>
              <option value="aura-zeus-en">Zeus (Male - Powerful, Commanding, US)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="ttsFormatSelect">Audio Output Format</label>
            <select id="ttsFormatSelect">
              <option value="mp3" selected>MP3 (High Quality & Compatibility)</option>
              <option value="wav">WAV (Linear PCM Audio)</option>
              <option value="opus">Opus (Ultra Low Latency)</option>
              <option value="aac">AAC</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="ttsTextInput">Input Text to Synthesize</label>
          <textarea id="ttsTextInput" placeholder="Type or paste the text you want EquiliLearn to speak out loud...">Welcome to EquiliLearn! Our platform provides adaptive and inclusive learning experiences for every student.</textarea>
          
          <div class="preset-chips">
            <span style="font-size: 0.78rem; color: var(--text-muted); align-self: center;">Presets:</span>
            <span class="chip" onclick="setTtsPreset('Welcome to EquiliLearn! Empowering learners everywhere with accessible, AI-powered tools.')">🎓 Welcome Intro</span>
            <span class="chip" onclick="setTtsPreset('Artificial Intelligence in education adapts to each learner\'s unique pace and style.')">🤖 AI Education</span>
            <span class="chip" onclick="setTtsPreset('Deepgram Aura produces natural, conversational voice synthesis with ultra-low latency.')">⚡ Fast Voice</span>
            <span class="chip" onclick="setTtsPreset('Congratulations on completing today\'s interactive lesson! You have earned 50 experience points.')">🏆 Milestone</span>
          </div>
        </div>

        <div class="controls" style="margin-top: 1.5rem;">
          <button id="synthesizeBtn" class="btn-primary" onclick="synthesizeSpeech()">
            <svg id="synthIcon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="synthBtnText">Synthesize & Play</span>
          </button>
        </div>

        <!-- TTS Audio Player Card -->
        <div id="ttsPlayerCard" class="tts-player-card" style="display: none;">
          <div class="player-header">
            <span id="ttsVoiceBadge" class="voice-badge">aura-asteria-en</span>
            <span id="ttsMetaInfo" style="font-size: 0.82rem; color: var(--text-muted);">-</span>
          </div>
          <audio id="ttsAudioPlayer" controls autoplay></audio>
          <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
            <button class="btn-secondary" onclick="downloadTtsAudio()">⬇️ Download Audio</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- TAB 2: SPEECH-TO-TEXT (STT)               -->
    <!-- ========================================== -->
    <div id="sttTab" class="tab-content">
      <div class="card">
        <div class="settings-grid">
          <div class="form-group">
            <label for="langSelect">Recognition Language</label>
            <select id="langSelect">
              <option value="id-ID" selected>Bahasa Indonesia (id-ID)</option>
              <option value="en-US">English (en-US)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="tokenInput">JWT Auth Token (Optional)</label>
            <input type="text" id="tokenInput" placeholder="Paste your Bearer JWT token or leave empty for Guest demo..." />
          </div>
        </div>

        <div class="visualizer-container">
          <canvas id="audioVisualizer"></canvas>

          <div class="controls">
            <button id="micBtn" class="btn-primary mic-btn" onclick="toggleRecording()">
              <svg id="micIcon" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
              </svg>
              <span id="micBtnText">Start Listening</span>
            </button>
          </div>

          <div class="status-indicator">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Ready to connect</span>
          </div>
        </div>

        <div class="transcript-box" id="transcriptBox">
          <span id="finalTranscript" class="final-text"></span>
          <span id="interimTranscript" class="interim-text"></span>
        </div>

        <div class="actions-row">
          <span id="statsInfo">Confidence: - | Chunks Sent: 0</span>
          <div style="display: flex; gap: 0.5rem;">
            <button class="btn-secondary" onclick="clearTranscript()">Clear</button>
            <button class="btn-secondary" onclick="copyTranscript()">Copy Text</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Tab Switching
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabId).classList.add('active');
      if (tabId === 'sttTab') {
        resizeCanvas();
      }
    }

    // ==========================================
    // TTS LOGIC
    // ==========================================
    let currentAudioBlobUrl = null;
    let currentAudioFormat = 'mp3';

    function setTtsPreset(text) {
      document.getElementById('ttsTextInput').value = text;
    }

    // Load available voices on startup
    async function loadVoices() {
      try {
        const res = await fetch('/api/v1/speech/voices');
        if (res.ok) {
          const body = await res.json();
          if (body.data && body.data.length > 0) {
            const select = document.getElementById('ttsVoiceSelect');
            select.innerHTML = '';
            body.data.forEach(v => {
              const opt = document.createElement('option');
              opt.value = v.id;
              opt.textContent = `${v.name} (${v.gender} - ${v.language}) - ${v.description}`;
              select.appendChild(opt);
            });
          }
        }
      } catch (err) {
        console.warn("Could not fetch remote voices list:", err);
      }
    }
    loadVoices();

    async function synthesizeSpeech() {
      const text = document.getElementById('ttsTextInput').value.trim();
      if (!text) {
        alert("Please enter some text to synthesize.");
        return;
      }

      const voice = document.getElementById('ttsVoiceSelect').value;
      const format = document.getElementById('ttsFormatSelect').value;
      currentAudioFormat = format;

      const btn = document.getElementById('synthesizeBtn');
      const btnText = document.getElementById('synthBtnText');
      btn.disabled = true;
      btnText.textContent = "Synthesizing...";

      const startTime = performance.now();

      try {
        const response = await fetch('/api/v1/speech/synthesize', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'audio/*'
          },
          body: JSON.stringify({
            text: text,
            voice: voice,
            format: format
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`Server returned ${response.status}: ${errText}`);
        }

        const audioBlob = await response.blob();
        const duration = Math.round(performance.now() - startTime);

        if (currentAudioBlobUrl) {
          URL.revokeObjectURL(currentAudioBlobUrl);
        }
        currentAudioBlobUrl = URL.createObjectURL(audioBlob);

        const playerCard = document.getElementById('ttsPlayerCard');
        const audioPlayer = document.getElementById('ttsAudioPlayer');
        const voiceBadge = document.getElementById('ttsVoiceBadge');
        const metaInfo = document.getElementById('ttsMetaInfo');

        voiceBadge.textContent = voice;
        metaInfo.textContent = `Latency: ${duration}ms | Size: ${(audioBlob.size / 1024).toFixed(1)} KB`;

        playerCard.style.display = 'flex';
        audioPlayer.src = currentAudioBlobUrl;
        audioPlayer.play();

      } catch (err) {
        console.error("TTS error:", err);
        alert("Text-to-Speech Error: " + err.message);
      } finally {
        btn.disabled = false;
        btnText.textContent = "Synthesize & Play";
      }
    }

    function downloadTtsAudio() {
      if (!currentAudioBlobUrl) return;
      const a = document.createElement('a');
      a.href = currentAudioBlobUrl;
      a.download = `equililearn_tts_${Date.now()}.${currentAudioFormat}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // ==========================================
    // STT LOGIC
    // ==========================================
    let isRecording = false;
    let ws = null;
    let audioContext = null;
    let mediaStream = null;
    let processorNode = null;
    let analyserNode = null;
    let animationFrameId = null;
    let chunksSent = 0;

    const micBtn = document.getElementById('micBtn');
    const micBtnText = document.getElementById('micBtnText');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const finalSpan = document.getElementById('finalTranscript');
    const interimSpan = document.getElementById('interimTranscript');
    const statsInfo = document.getElementById('statsInfo');
    const canvas = document.getElementById('audioVisualizer');
    const canvasCtx = canvas.getContext('2d');

    function resizeCanvas() {
      if (canvas.parentElement) {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = 70;
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawVisualizer() {
      if (!analyserNode) {
        canvasCtx.fillStyle = 'rgba(11, 15, 25, 1)';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
        return;
      }

      const bufferLength = analyserNode.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyserNode.getByteTimeDomainData(dataArray);

      canvasCtx.fillStyle = 'rgba(11, 15, 25, 0.4)';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      canvasCtx.lineWidth = 2.5;
      canvasCtx.strokeStyle = '#6366f1';
      canvasCtx.shadowBlur = 10;
      canvasCtx.shadowColor = '#6366f1';

      canvasCtx.beginPath();
      const sliceWidth = canvas.width * 1.0 / bufferLength;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 128.0;
        const y = v * (canvas.height / 2);

        if (i === 0) {
          canvasCtx.moveTo(x, y);
        } else {
          canvasCtx.lineTo(x, y);
        }
        x += sliceWidth;
      }

      canvasCtx.lineTo(canvas.width, canvas.height / 2);
      canvasCtx.stroke();
      canvasCtx.shadowBlur = 0;

      if (isRecording) {
        animationFrameId = requestAnimationFrame(drawVisualizer);
      }
    }

    async function toggleRecording() {
      if (!isRecording) {
        await startRecording();
      } else {
        stopRecording();
      }
    }

    async function startRecording() {
      try {
        const lang = document.getElementById('langSelect').value;
        const token = document.getElementById('tokenInput').value.trim();

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        let wsUrl = `${protocol}//${window.location.host}/api/v1/ws/speech-to-text?lang=${lang}`;
        if (token) {
          wsUrl += `&token=${encodeURIComponent(token)}`;
        }

        statusText.textContent = "Connecting to WebSocket...";
        statusDot.className = "status-dot";

        ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';

        ws.onopen = async () => {
          statusText.textContent = "Streaming live audio...";
          statusDot.className = "status-dot streaming";
          micBtn.classList.add('recording');
          micBtnText.textContent = "Stop Listening";
          isRecording = true;
          chunksSent = 0;

          await setupAudioCapture();
          drawVisualizer();
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            handleServerMessage(data);
          } catch (e) {
            console.error("Failed to parse message:", e);
          }
        };

        ws.onerror = (err) => {
          console.error("WebSocket error:", err);
          statusText.textContent = "WebSocket connection error";
          statusDot.className = "status-dot";
        };

        ws.onclose = () => {
          if (isRecording) {
            stopRecording();
          }
          statusText.textContent = "Disconnected";
          statusDot.className = "status-dot";
        };

      } catch (err) {
        console.error("Recording error:", err);
        alert("Microphone access error: " + err.message);
        stopRecording();
      }
    }

    async function setupAudioCapture() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          sampleRate: 16000,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

      const source = audioContext.createMediaStreamSource(mediaStream);
      analyserNode = audioContext.createAnalyser();
      analyserNode.fftSize = 2048;
      source.connect(analyserNode);

      const bufferSize = 4096;
      processorNode = audioContext.createScriptProcessor(bufferSize, 1, 1);

      processorNode.onaudioprocess = (e) => {
        if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) return;

        const inputData = e.inputBuffer.getChannelData(0);
        const pcm16 = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) {
          let s = Math.max(-1, Math.min(1, inputData[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        ws.send(pcm16.buffer);
        chunksSent++;
        statsInfo.textContent = `Confidence: ${(window.lastConfidence || 0).toFixed(2)} | Chunks Sent: ${chunksSent}`;
      };

      source.connect(processorNode);
      processorNode.connect(audioContext.destination);
    }

    function handleServerMessage(msg) {
      if (msg.type === 'transcript') {
        const payload = msg.payload;
        window.lastConfidence = payload.confidence;

        if (payload.is_final) {
          finalSpan.textContent += (finalSpan.textContent ? ' ' : '') + payload.text;
          interimSpan.textContent = '';
        } else {
          interimSpan.textContent = payload.text;
        }

        const box = document.getElementById('transcriptBox');
        box.scrollTop = box.scrollHeight;
        statsInfo.textContent = `Confidence: ${(payload.confidence || 0).toFixed(2)} | Chunks Sent: ${chunksSent}`;
      } else if (msg.type === 'ready') {
        statusText.textContent = `Ready (Session: ${msg.payload.session_id.substring(0, 8)}...)`;
        statusDot.className = "status-dot streaming";
      } else if (msg.type === 'error') {
        console.error("Server STT error:", msg.payload);
        statusText.textContent = "Error: " + (msg.payload.message || "Unknown");
      }
    }

    function stopRecording() {
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtnText.textContent = "Start Listening";
      statusDot.className = "status-dot";
      statusText.textContent = "Stopped";

      if (processorNode) {
        processorNode.disconnect();
        processorNode = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      if (audioContext && audioContext.state !== 'closed') {
        audioContext.close();
        audioContext = null;
      }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
      }
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
      }
      drawVisualizer();
    }

    function clearTranscript() {
      finalSpan.textContent = '';
      interimSpan.textContent = '';
    }

    function copyTranscript() {
      const fullText = (finalSpan.textContent + ' ' + interimSpan.textContent).trim();
      if (!fullText) return;
      navigator.clipboard.writeText(fullText).then(() => {
        alert("Transcription copied to clipboard!");
      });
    }
  </script>
</body>
</html>
